<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopNest — Shop Smart, Live Better</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#" aria-label="ShopNest home">
        <span class="brand-mark">S</span>
        <span class="brand-name">Shop<em>Nest</em></span>
      </a>

      <div class="search-wrap">
        <input id="search-input" type="search" placeholder="Search products by name…" autocomplete="off" aria-label="Search products" />
      </div>

      <button id="cart-toggle" class="cart-btn" aria-label="Open cart">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L21 8H6"/></svg>
        <span>Cart</span>
        <span id="cart-count" class="cart-count">0</span>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Everything you need, <span>nested in one place.</span></h1>
      <p>Browse, search and filter our collection. Your cart is saved automatically.</p>
    </section>

    <nav id="filter-bar" class="filter-bar" aria-label="Category filters"></nav>

    <p id="result-info" class="result-info" aria-live="polite"></p>

    <div id="status" class="status" role="status"></div>
    <section id="product-grid" class="product-grid" aria-label="Products"></section>
    <div id="no-results" class="no-results" hidden>
      <div class="no-results-icon">🔍</div>
      <h3>No products found</h3>
      <p>Try a different search term or choose another category.</p>
    </div>
  </main>

  <!-- Cart drawer -->
  <div id="overlay" class="overlay" hidden></div>
  <aside id="cart-drawer" class="cart-drawer" aria-label="Shopping cart" aria-hidden="true">
    <div class="drawer-head">
      <h2>Your Cart</h2>
      <button id="cart-close" class="icon-btn" aria-label="Close cart">✕</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="drawer-foot">
      <div class="total-row"><span>Total</span><strong id="cart-total">₹0</strong></div>
      <button id="clear-cart" class="btn btn-ghost">Clear cart</button>
    </div>
  </aside>

  <footer class="site-footer">
    <div class="container">ShopNest · JavaScript Module End Project</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
